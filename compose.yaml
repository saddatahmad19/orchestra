services:
  orchestra:
    build: .
    image: orchestra:local
    container_name: orchestra
    restart: unless-stopped
    env_file: [.env]
    environment:
      ORCHESTRA_DATABASE: /data/orchestra.sqlite3
    ports:
      - "${ORCHESTRA_BIND_ADDRESS:-127.0.0.1}:8788:8080"
    volumes:
      - orchestra-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  orchestra-data:
